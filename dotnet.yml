name: Build and Test

# Runs on every push (and on pull requests) to any branch
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay.sln

      - name: Build
        run: dotnet build Part2/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2/RaceDay.sln --configuration Release --no-build --verbosity normal
